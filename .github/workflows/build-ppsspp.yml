name: Build PPSSPP App
on:
  workflow_dispatch:

env:
  APP_ID: com.example.ts3player
  APP_NAME: Toy Story 3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clone PPSSPP source
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/hrydgard/ppsspp.git ppsspp-src

      - name: Rename app (applicationId and label)
        run: |
          cd ppsspp-src
          sed -i -E "s/(applicationId[ =]+['\"])org\.ppsspp\.ppsspp(['\"])/\1${APP_ID}\2/" android/build.gradle
          grep -n "applicationId" android/build.gradle || true
          for f in $(grep -rl 'name="app_name"' android/res --include=strings.xml || true); do
            sed -i -E "s|(<string name=\"app_name\"[^>]*>)[^<]*(</string>)|\1${APP_NAME}\2|" "$f"
          done

      - name: Custom icon (optional, needs icon.png in repo root)
        run: |
          if [ -f icon.png ]; then
            find ppsspp-src/android/res -type f \( -name 'ic_launcher*.png' -o -name 'icon*.png' \) -exec cp icon.png {} \;
          fi

      - name: Build APK
        run: |
          cd ppsspp-src
          if [ ! -f gradlew ]; then cd android; fi
          chmod +x gradlew
          bash ./gradlew assembleNormalOptimized --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find ppsspp-src -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: TS3Player-apk
          path: out/name: Build PPSSPP App
