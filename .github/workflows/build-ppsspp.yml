name: Build PPSSPP App
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Get PPSSPP source
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/hrydgard/ppsspp.git ppsspp-src
      - name: Rename app
        run: |
          cd ppsspp-src
          sed -i 's/\(applicationId *=* *.\)org\.ppsspp\.ppsspp/\1com.example.ts3player/' android/build.gradle
          find android/res -name strings.xml -exec sed -i 's|>PPSSPP<|>Toy Story 3<|' {} +
      - name: Build
        run: |
          cd ppsspp-src
          if [ ! -f gradlew ]; then cd android; fi
          chmod +x gradlew
          bash ./gradlew assembleNormalOptimized --stacktrace
      - name: Collect
        run: |
          mkdir out
          find ppsspp-src -name '*.apk' -exec cp {} out/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: TS3Player-apk
          path: out/
