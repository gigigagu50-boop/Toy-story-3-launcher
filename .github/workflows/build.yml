name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip newest project zip
        run: |
          ZIP=$(git log --name-only --pretty=format: -- '*.zip' | sed '/^$/d' | head -1)
          echo "Pakai: $ZIP"
          unzip -o "$ZIP" -d proj
      - name: Custom icon (optional)
        run: |
          if [ -f icon.png ]; then
            rm -f proj/app/src/main/res/drawable/ic_launcher.xml
            cp icon.png proj/app/src/main/res/drawable/ic_launcher.png
          fi
      - name: Build debug APK
        run: cd proj && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TS3Launcher-apk
          path: proj/app/build/outputs/apk/debug/*.apk
